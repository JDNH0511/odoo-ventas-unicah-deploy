[options]
# Los valores ${...} se sustituyen en el entrypoint con variables de entorno.
db_host = ${DB_HOST}
db_port = ${DB_PORT}
db_user = ${DB_USER}
db_password = ${DB_PASSWORD}
db_name = ${DB_NAME}
db_filter = ${DB_NAME}

# Seguridad
list_db = False
admin_passwd = ${ODOO_ADMIN_PASSWD}
proxy_mode = True
web.base.url = https://odoo-unicah-yes5.onrender.com
web.base.url.freeze = True

# Red: 8070 por defecto. Si la plataforma define $PORT, el entrypoint lo respeta.
http_port = 8070
# Render (y la mayoría de plataformas Docker) exige escuchar en todas las interfaces.
http_interface = 0.0.0.0

# Recursos acordes al plan gratuito (1 GB RAM): un solo proceso, sin workers.
workers = 0
max_cron_threads = 1
limit_time_cpu = 120
limit_time_real = 240
limit_request = 8192

# Addons propios + datos
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
without_demo = True
